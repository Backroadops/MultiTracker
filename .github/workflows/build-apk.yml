name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -c "import sys; sys.path.insert(0, 'backend'); from main import app; assert app.title == 'MultiTracker API'"
  apk:
    permissions:
      contents: write
    needs: backend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            gradle :app:assembleDebug -PbackendUrl="$BACKEND_URL" --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        with:
          retention-days: 7
          name: MultiTracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Verify release APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish versioned APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MultiTracker.apk"
          gh release create "android-build-${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/MultiTracker.apk" --target "$GITHUB_SHA" --generate-notes --latest
