<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MultiTracker</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#081d30;color:#e8ffff;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}button,input{background:#18384a;color:white;border:1px solid #46717c;border-radius:8px;padding:9px}button{cursor:pointer}#map{height:calc(100dvh - 170px);min-height:300px}#filters{display:flex;flex-wrap:wrap;gap:12px;padding:8px 12px}#status{padding:8px 12px}#url{width:min(300px,70vw)}.marker{font-size:24px;cursor:pointer;text-shadow:0 0 5px white}.maplibregl-popup-content{color:#081d30}</style></head><body><header><svg width="44" height="44" viewBox="0 0 108 108"><rect width="108" height="108" rx="20" fill="#081d30"/><g fill="none" stroke="#4de8d4"><circle cx="54" cy="54" r="40"/><circle cx="54" cy="54" r="26"/><circle cx="54" cy="54" r="13"/><path d="M14 54H94M54 14V94M54 54L87 33"/></g><path fill="white" d="M54 25L58 43 77 54 77 59 58 54 58 69 65 75 65 79 54 75 43 79 43 75 50 69 50 54 31 59 31 54 50 43Z"/></svg><h1>MultiTracker</h1><button id="gps">My location</button><button id="sweden">Sweden</button><button id="theme">Dark map</button><button id="connect">Refresh</button><details><summary>Advanced</summary><input id="url" value="https://multitracker-api.onrender.com" placeholder="Optional HTTPS backend URL"></details></header><div id="filters"></div><div id="status" role="status">Connecting to aircraft feed…</div><div id="map"></div><script>
const types={aircraft:'✈',helicopter:'🚁',ship:'🚢',train:'🚆',bus:'🚌',other:'🚗'};
const filters=document.getElementById('filters'),status=document.getElementById('status'),url=document.getElementById('url');let data=[],markers=[],generation=0,lastRequest=0,dark=false;const counts={};const colors={aircraft:"#087eaa",helicopter:"#a855f7",ship:"#2563eb",train:"#d97706",bus:"#15803d",other:"#64748b"};const enabled=new Set(Object.keys(types));
for(const [type,icon] of Object.entries(types)){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.onchange=()=>{box.checked?enabled.add(type):enabled.delete(type);draw()};const count=document.createElement('span');counts[type]=count;label.append(box,icon+' '+type+' ',count);filters.append(label)}
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[18.06,59.33],zoom:6});map.addControl(new maplibregl.NavigationControl());
function draw(){for(const t of Object.keys(types))counts[t].textContent=(t==="aircraft"||t==="helicopter"||url.value.trim())?String(data.filter(v=>v.type===t).length):"—";markers.forEach(m=>m.remove());markers=[];for(const v of data){if(!enabled.has(v.type)||!Number.isFinite(v.longitude)||!Number.isFinite(v.latitude))continue;const el=document.createElement('div');el.className='marker';el.textContent=types[v.type];el.style.color=colors[v.type];el.style.background='white';el.style.border='2px solid '+colors[v.type];el.style.borderRadius='50%';el.style.padding='3px';const info=document.createElement('div');info.textContent=(v.label||v.id)+' · '+v.type+' · '+(v.speed_kmh??'—')+' km/h';markers.push(new maplibregl.Marker({element:el}).setLngLat([v.longitude,v.latitude]).setPopup(new maplibregl.Popup().setDOMContent(info)).addTo(map))}}
async function refresh(){if(Date.now()-lastRequest<60000)return;lastRequest=Date.now();const seq=++generation;try{const c=map.getCenter();let endpoint;if(url.value.trim()){const base=new URL(url.value);if(base.protocol!=='https:')throw Error('Use HTTPS');endpoint=new URL(base.href.replace(/\/$/,'')+'/vehicles');endpoint.search=new URLSearchParams({lat:c.lat,lon:c.lng});}else{endpoint='https://api.adsb.lol/v2/lat/'+c.lat.toFixed(3)+'/lon/'+c.lng.toFixed(3)+'/dist/150';}const r=await fetch(endpoint,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP '+r.status);const result=await r.json();if(seq!==generation)return;data=url.value.trim()?result:(result.ac||[]).filter(a=>Number.isFinite(a.lat)&&Number.isFinite(a.lon)).map(a=>({id:a.hex,label:(a.flight||a.r||a.hex||'Aircraft').trim(),type:a.category==='A7'?'helicopter':'aircraft',latitude:a.lat,longitude:a.lon,speed_kmh:Number.isFinite(a.gs)?Math.round(a.gs*1.852):null}));if(!Array.isArray(data))throw Error('Invalid response');draw();status.textContent=data.length+' vehicles · '+new Date().toLocaleTimeString()+(url.value.trim()?' · Backend':' · ADS-B · Other feeds not connected');}catch(e){if(seq!==generation)return;data=[];draw();status.textContent='Live feed unavailable: '+e.message+' · Retry in 60 seconds';}}
document.getElementById('theme').onclick=()=>{dark=!dark;map.setStyle('https://tiles.openfreemap.org/styles/'+(dark?'dark':'liberty'));document.getElementById('theme').textContent=dark?'Light map':'Dark map';};
document.getElementById('connect').onclick=refresh;document.getElementById('sweden').onclick=()=>map.flyTo({center:[18.06,59.33],zoom:6});document.getElementById('gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:11}),e=>status.textContent=e.message);map.once("load",refresh);setInterval(()=>{if(!document.hidden)refresh()},60000);draw();
</script></body></html>
