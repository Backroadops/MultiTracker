<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MultiTracker</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#081d30;color:#e8ffff;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}button,input{background:#18384a;color:white;border:1px solid #46717c;border-radius:8px;padding:9px}button{cursor:pointer}#map{height:calc(100dvh - 170px);min-height:300px}#filters{display:flex;flex-wrap:wrap;gap:12px;padding:8px 12px}#status{padding:8px 12px}#url{width:min(300px,70vw)}.marker{font-size:24px;cursor:pointer;text-shadow:0 0 5px white}.maplibregl-popup-content{color:#081d30}</style></head><body><header><svg width="44" height="44" viewBox="0 0 108 108"><rect width="108" height="108" rx="20" fill="#081d30"/><g fill="none" stroke="#4de8d4"><circle cx="54" cy="54" r="40"/><circle cx="54" cy="54" r="26"/><circle cx="54" cy="54" r="13"/><path d="M14 54H94M54 14V94M54 54L87 33"/></g><path fill="white" d="M54 25L58 43 77 54 77 59 58 54 58 69 65 75 65 79 54 75 43 79 43 75 50 69 50 54 31 59 31 54 50 43Z"/></svg><h1>MultiTracker <small>0.5.2</small></h1><button id="gps">My location</button><button id="sweden">Sweden</button><button id="world">Worldwide</button><button id="theme">Dark map</button><button id="connect">Refresh</button><details><summary>Advanced</summary><input id="url" value="https://multitracker-api.onrender.com" placeholder="Optional HTTPS backend URL"></details></header><div id="filters"></div><div id="status" role="status">Connecting to live feeds…</div><div id="map"></div><script>
const types={aircraft:'✈',helicopter:'🚁',ship:'🚢',train:'🚆',bus:'🚌',other:'🚗'};
const filters=document.getElementById('filters'),status=document.getElementById('status'),url=document.getElementById('url');let data=[],markers=[],generation=0,lastRequest=0,dark=false;const counts={};const colors={aircraft:"#087eaa",helicopter:"#a855f7",ship:"#2563eb",train:"#d97706",bus:"#15803d",other:"#64748b"};const enabled=new Set(Object.keys(types));
for(const [type,icon] of Object.entries(types)){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.onchange=()=>{box.checked?enabled.add(type):enabled.delete(type);draw()};const count=document.createElement('span');counts[type]=count;label.append(box,icon+' '+type+' ',count);filters.append(label)}
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[18.06,59.33],zoom:6});map.addControl(new maplibregl.NavigationControl());
function draw(){
 for(const t of Object.keys(types))counts[t].textContent=['aircraft','helicopter','ship'].includes(t)?String(data.filter(v=>v.type===t).length):'—';
 markers.forEach(m=>m.remove());markers=[];
 const groups=new Map(), zoom=map.getZoom(), cell=zoom<11?48:1;
 for(const v of data){
 if(!enabled.has(v.type)||!Number.isFinite(v.longitude)||!Number.isFinite(v.latitude))continue;
 const p=map.project([v.longitude,v.latitude]);
 const k=(v.type==='ship'?'ship':'air')+':'+Math.floor(p.x/cell)+':'+Math.floor(p.y/cell);
 if(!groups.has(k))groups.set(k,[]);groups.get(k).push(v);
 }
 for(const vs of groups.values()){
 const v=vs[0],el=document.createElement('div');el.className='marker';
 el.style.cssText='background:white;border:2px solid '+colors[v.type]+';color:'+colors[v.type]+';border-radius:50%;padding:4px;font-size:22px;line-height:1.2;cursor:pointer';
 el.textContent=vs.length>1?types[v.type]+' '+vs.length:types[v.type];
 const marker=new maplibregl.Marker({element:el}).setLngLat([v.longitude,v.latitude]);
 if(vs.length>1)el.addEventListener('click',()=>map.easeTo({center:[v.longitude,v.latitude],zoom:Math.min(14,zoom+2)}));
 else {const info=document.createElement('div');info.textContent=(v.label||v.id)+' · '+v.type+' · '+(v.speed_kmh??'—')+' km/h';marker.setPopup(new maplibregl.Popup().setDOMContent(info));}
 markers.push(marker.addTo(map));
 }
}
map.on('moveend',draw);
map.on('style.load',draw);
let timer,controller;
async function refresh(){
 const seq=++generation;
 if(controller)controller.abort();controller=new AbortController();
 try{
 const b=map.getBounds(),span=b.getEast()-b.getWest(),norm=x=>((x+180)%360+360)%360-180;
 const endpoint=new URL((url.value.trim()||'https://multitracker-api.onrender.com').replace(/\/$/,'')+'/map/vehicles');
 if(endpoint.protocol!=='https:')throw Error('Use HTTPS');
 endpoint.search=new URLSearchParams({south:Math.max(-90,b.getSouth()),north:Math.min(90,b.getNorth()),west:span>=360?-180:norm(b.getWest()),east:span>=360?180:norm(b.getEast())});
 status.textContent='Loading map area…';
 const timeout=setTimeout(()=>controller.abort(),40000);
 let r;try{r=await fetch(endpoint,{signal:controller.signal});}finally{clearTimeout(timeout);}
 if(!r.ok)throw Error('HTTP '+r.status);const result=await r.json();if(seq!==generation)return;
 data=result.vehicles;draw();
 status.textContent=data.length+' vehicles · AIS: '+result.ais_status+' · Aircraft: '+(result.aircraft_status==='cached_regions_only'?'cached regions only — zoom in for live data':result.aircraft_status)+' · '+new Date().toLocaleTimeString();
 }catch(e){if(seq===generation){data=[];draw();status.textContent='Live feed unavailable: '+e.message;}}
}
map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(refresh,1500)});
document.getElementById('world').onclick=()=>map.flyTo({center:[0,20],zoom:1});
document.getElementById('theme').onclick=()=>{dark=!dark;map.setStyle('https://tiles.openfreemap.org/styles/'+(dark?'dark':'liberty'));document.getElementById('theme').textContent=dark?'Light map':'Dark map';};
document.getElementById('connect').onclick=refresh;document.getElementById('sweden').onclick=()=>map.flyTo({center:[18.06,59.33],zoom:6});document.getElementById('gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:11}),e=>status.textContent=e.message);map.once("load",()=>{draw();refresh()});setInterval(()=>{if(!document.hidden)refresh()},60000);draw();
</script></body></html>
